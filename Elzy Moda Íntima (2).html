<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elzy Moda Íntima</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Jost:wght@400;500&family=Poppins:wght@400;500&display=swap">
<style>
:root{--bg:#FDEEF6;--ink:#3A0A24;--mut:#8A5473;--line:#F2C4DC;--field:#fff;--pink:#E3288A;--deep:#B8156E;--btn:#C91E78;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F0A16;--ink:#FBE6F1;--mut:#D9A3C0;--line:#4D1F37;--field:#2A0F1E}}
:root[data-theme="dark"]{--bg:#1F0A16;--ink:#FBE6F1;--mut:#D9A3C0;--line:#4D1F37;--field:#2A0F1E}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Jost,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:28px 18px 48px;display:grid;gap:28px;grid-template-columns:1fr}
@media(min-width:820px){.wrap{grid-template-columns:1fr 370px;align-items:start}.view .wrap{grid-template-columns:370px;justify-content:center}}
h1{font:600 2rem/1.1 "Bodoni Moda",Georgia,serif;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 20px}
label{display:block;font-weight:500;font-size:.9rem;margin:14px 0 4px}
input{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.gen{font-size:.78rem;color:var(--mut);margin:3px 2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gen:empty{display:none}
.sticky{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
.card{background:#fff;color:#3A0A24;border-radius:22px;padding:34px 24px 24px;text-align:center;border-top:8px solid var(--pink);box-shadow:0 22px 44px -22px rgba(201,30,120,.55)}
.logo{width:170px;max-width:60%;height:auto;color:var(--pink);display:block;margin:0 auto}
.tag{margin:18px 0 0;font:500 1rem/1.4 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--deep)}
.info{margin:14px 0 0;font-size:.9rem;color:#6B3A55}
.info p{margin:2px 0}
.links{display:grid;gap:8px;margin-top:22px}
.links a{display:block;border:1.5px solid var(--btn);color:var(--deep);text-decoration:none;padding:12px 14px;border-radius:999px;font-weight:500;transition:background .15s,color .15s}
.links a:hover{background:var(--btn);color:#fff}
.links a.main{background:var(--btn);color:#fff}
.links a.main:hover{background:var(--deep)}
.empty{color:#6B3A55;font-size:.9rem;margin:20px 0 0}
.cmsg{min-height:1.3em;margin:10px 0 0;font-size:.85rem;color:var(--mut);text-align:center}
.btn{margin-top:4px;width:100%;font:inherit;font-weight:500;padding:12px;border-radius:999px;border:0;background:var(--btn);color:#fff;cursor:pointer}
.msg{min-height:1.3em;margin:8px 0 0;font-size:.85rem;color:var(--mut);text-align:center}
.mine{display:none;text-align:center;margin-top:16px;color:var(--mut);font-size:.9rem}
.view .editor,.view .btn,.view .msg{display:none}
.view .mine{display:block}
.ov{position:fixed;inset:0;z-index:50;background:#1B0B14;overflow:auto;-webkit-overflow-scrolling:touch}
.ovh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:#1B0B14;color:#fff;border-bottom:1px solid #4D1F37}
.ovt{flex:1;font-weight:500;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovb{font:inherit;font-size:.9rem;font-weight:500;color:#fff;background:var(--btn);border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
.ovm{display:block;text-align:center;color:#F2C4DC;font-size:.85rem;min-height:1.2em;padding-top:6px}
.ovc{max-width:860px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.ovc img{display:block;width:100%;height:auto;background:#2A0F1E}
</style>
</head>
<body>
<div class="wrap">
  <section class="editor">
    <h1>Cartão de apresentação da Elzy</h1>
    <p class="sub">Preencha o que quiser mostrar. Os links são gerados sozinhos.</p>
    <label for="r">Frase da loja</label><input id="r" maxlength="70" placeholder="Conforto e delicadeza em cada peça">
    <label for="a">Endereço</label><input id="a" autocomplete="street-address" placeholder="Rua, número, bairro e cidade">
    <div id="gen-a" class="gen"></div>
    <label for="h">Horário de atendimento</label><input id="h" placeholder="Seg a sáb, 9h às 18h">
    <div id="fields"></div>
  </section>
  <aside class="sticky">
    <div class="card" id="card"></div>
    <button class="btn" id="share" type="button">Copiar link do cartão da Elzy</button>
    <p class="msg" id="msg" role="status"></p>
    
  </aside>
</div>
